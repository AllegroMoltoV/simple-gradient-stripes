<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stripes" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="128" spreadMethod="reflect" gradientTransform="rotate(-30 256 256)">
      <stop offset="0" stop-color="#3a3fd6"/>
      <stop offset="1" stop-color="#9fe7ff"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#stripes)"/>
  </g>
</svg>
